{% extends 'parking_app/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4">🔐 Enable Two-Factor Authentication</h3>
                    
                    <p class="text-muted mb-4">
                        Two-Factor Authentication adds an extra layer of security to your account. 
                        After enabling, you'll need to enter a verification code when logging in.
                    </p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary btn-block w-100">
                            Enable 2FA
                        </button>
                    </form>
                    
                    <a href="{% url 'profile' %}" class="btn btn-secondary btn-block w-100 mt-2">
                        Back to Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
